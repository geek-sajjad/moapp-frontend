<div class="min-h-screen bg-gradient-to-br from-primary/5 via-background to-secondary/10 p-3">
  <div class="w-full space-y-4">
    <!-- Back Button -->
    <div class="animate-fade-in-down duration-300">
      <app-button 
        [variant]="'outline'"
        [size]="'sm'"
        (clicked)="goBack()"
      >
        <app-icon name="arrow-left" [size]="16" />
        بازگشت به لیست افراد
      </app-button>
    </div>

    <!-- Person Info Card -->
    @if (currentPerson(); as person) {
      @if (transactionSummray(); as summary) {
        <app-person-info-card 
          [person]="person"
          [transactionSummray]="summary"
          (onEdit)="openEditPersonModal()" 
        />
      }
    }

    <!-- Transaction Form Card -->
    <app-transaction-form
      [isEditing]="isEditing()"
      [initialData]="transactionFormData()"
      (onSave)="saveTransaction($event)"
      (onCancel)="clearTransactionForm()"
    />

    <!-- Transactions List (from API: GET /transactions/customer/{customerId}) -->
    @if (transactionsLoading()) {
      <div class="bg-white rounded-xl shadow-xl border border-gray-300 overflow-hidden p-10 text-center">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-50 mb-4 animate-pulse">
          <app-icon name="loading" [size]="28" class="text-blue-600" />
        </div>
        <p class="text-gray-600 font-medium">در حال بارگذاری تراکنش‌ها...</p>
      </div>
    } @else {
      <app-transaction-list [transactions]="transactions()" />
    }

    <!-- Share Button -->
    @if (transactions().length > 0) {
      <div class="animate-slide-up duration-500">
        <app-button
          [variant]="'secondary'"
          [fullWidth]="true"
          [size]="'lg'"
          (clicked)="shareStatement()"
        >
          <app-icon name="share" [size]="18" />
          اشتراک‌گذاری صورتحساب
        </app-button>
      </div>
    }
  </div>
</div>

<!-- Edit Customer Modal -->
<app-modal 
  [isOpen]="showEditPersonModal()" 
  [title]="'ویرایش مشخصات مشتری'"
  (closed)="closeEditPersonModal()"
>
  <app-edit-person-form
    [initialData]="editPersonData()"
    (onSave)="saveEditedPerson($event)"
  />
</app-modal>

<!-- Confirm Dialog -->
<app-confirm-dialog
  [isOpen]="showConfirmDialog()"
  [message]="confirmMessage()"
  (confirmed)="onConfirm($event)"
/>
