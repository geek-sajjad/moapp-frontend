<div class="hover:bg-gray-50 transition-colors group  ">
  <div class="flex items-center justify-between px-5 py-4">
    <!-- Left: Icon + Content -->
    <div class="flex items-center gap-4 min-w-0">
      <!-- Icon -->
      <div [class]="
          'w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0 ' +
          (transaction().type === 'DEBIT'
            ? 'bg-red-100 text-red-600'
            : 'bg-green-100 text-green-600')
        ">
        <app-icon [name]="transaction().type === 'DEBIT' ? 'minus' : 'plus'" [size]="18" />
      </div>
  
      <!-- Text content -->
      <div class="min-w-0">
        <div class="mt-0.5 flex items-center gap-1.5 text-s text-gray-500">
          <app-icon name="calendar" [size]="12" />
          {{ transactionDate() }}
        </div>
      </div>
    </div>
  
    <!-- Right: Amount -->
    <div [class]="
        'flex text-base font-semibold tabular-nums whitespace-nowrap ' +
        (transaction().type === 'DEBIT'
          ? 'text-red-600'
          : 'text-green-600')
      ">
      <div class="ml-1">
        {{ transaction().type === 'DEBIT' ? '-' : '+' }}
        {{ formatNumber(transaction().amount) }}
  
      </div>
      <div>
        تومان
      </div>
    </div>
  </div>
<div class="px-5 pb-4">
  <p class="
      text-sm
      leading-relaxed
      text-gray-800
      line-clamp-2
      break-words
    ">
    {{ transaction().description }}
  </p>
</div>
</div>
