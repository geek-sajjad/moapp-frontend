<div class="bg-white rounded-xl shadow-xl border border-gray-300 overflow-hidden animate-slide-up duration-500">
  <div class="bg-gradient-to-r from-blue-100 to-gray-100 px-5 py-4 border-b border-gray-300">
    <h2 class="text-lg font-extrabold text-gray-900 flex items-center gap-2.5">
      <app-icon name="file-text" [size]="20" class="text-blue-600" />
      تراکنش‌ها
      @if (transactions() && transactions().length > 0) {
        <span class="text-sm font-semibold text-gray-600">({{ transactions().length }})</span>
      }
    </h2>
  </div>

  <div class="divide-y divide-border">
    @if (!transactions() || transactions().length === 0) {
      <div class="p-10 text-center">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gray-100 mb-4">
          <app-icon name="file" [size]="36" class="text-gray-400" />
        </div>
        <p class="text-gray-700 text-lg font-bold">هیچ تراکنشی ثبت نشده است</p>
        <p class="text-gray-500 text-sm font-medium mt-2">تراکنش اول را ثبت کنید</p>
      </div>
    }

    @if (transactions()) {
      @for (transaction of transactions(); track transaction.id) {
        <app-transaction-item [transaction]="transaction" />
      }
    }
  </div>
</div>
