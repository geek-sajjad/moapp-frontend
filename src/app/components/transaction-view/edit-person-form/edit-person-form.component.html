<div class="space-y-5">
  <div class="space-y-2.5">
    <label class="block text-sm font-bold text-gray-900">نام</label>
    <input
      type="text"
      [value]="formName()"
      (input)="formName.set($any($event.target).value)"
      placeholder="نام شخص را وارد کنید"
      class="w-full min-h-[48px] px-4 py-3 border-2 border-gray-300 bg-white rounded-xl text-base font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 focus:border-blue-500 hover:border-blue-400 placeholder:text-gray-400 placeholder:font-normal touch-manipulation"
    />
  </div>
  
  <div class="space-y-2.5">
    <label class="block text-sm font-bold text-gray-900">شماره تلفن</label>
    <input
      type="text"
      [value]="formPhone()"
      (input)="formPhone.set($any($event.target).value)"
      placeholder="شماره تلفن را وارد کنید"
      class="w-full min-h-[48px] px-4 py-3 border-2 border-gray-300 bg-white rounded-xl text-base font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 focus:border-blue-500 hover:border-blue-400 placeholder:text-gray-400 placeholder:font-normal touch-manipulation"
    />
  </div>
  
  <div class="space-y-2.5">
    <label class="block text-sm font-bold text-gray-900">آدرس</label>
    <textarea
      [value]="formAddress()"
      (input)="formAddress.set($any($event.target).value)"
      rows="4"
      placeholder="آدرس را وارد کنید"
      class="w-full px-4 py-3 border-2 border-gray-300 bg-white rounded-xl text-base font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 focus:border-blue-500 hover:border-blue-400 placeholder:text-gray-400 placeholder:font-normal resize-none touch-manipulation"
    ></textarea>
  </div>
  
  <app-button 
    [fullWidth]="true"
    [size]="'lg'"
    (clicked)="handleSave()"
    class="mt-2"
  >
    <app-icon [name]="buttonIcon()" [size]="18" />
    {{ buttonText() }}
  </app-button>
</div>
