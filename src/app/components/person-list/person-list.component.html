<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-gray-50 p-3">
  <div class="w-full">
    <!-- Header Card -->
    <div class="bg-white rounded-xl shadow-xl border border-gray-300 mb-4 overflow-hidden animate-fade-in-down duration-300">
      <app-header 
        [currentUser]="currentUser()"
        (onLogout)="logout()"
      />

      <!-- Search Bar -->
      <div class="p-4 bg-gray-50">
        <app-search-bar 
          [value]="searchTerm()"
          [placeholder]="'جستجو بر اساس نام...'"
          (onChange)="onSearchChange($event)"
        />
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col gap-3 mb-4">
      <h2 class="text-xl font-extrabold text-gray-900 flex items-center gap-2.5">
        <app-icon name="users" [size]="22" class="text-blue-600" />
        لیست افراد
        @if (people().length > 0) {
          <span class="text-sm font-semibold text-gray-500">({{ people().length }} نفر)</span>
        }
      </h2>
      <div class="flex gap-3">
        <app-button 
          [variant]="'default'"
          [size]="'default'"
          (clicked)="openAddModal()"
          class="flex-1"
        >
          <app-icon name="plus" [size]="18" />
          افزودن
        </app-button>
      </div>
    </div>

    <!-- People List -->
    <div class="space-y-2.5">
      @if (people().length === 0) {
        <div class="bg-white rounded-xl shadow-lg border border-gray-300 p-10 text-center animate-fade-in-scale duration-300">
          <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gray-100 mb-4">
            <app-icon name="users" [size]="36" class="text-gray-400" />
          </div>
          <p class="text-gray-700 text-lg font-bold">هیچ شخصی یافت نشد</p>
          <p class="text-gray-500 text-sm font-medium mt-2">برای شروع، یک شخص جدید اضافه کنید</p>
        </div>
      }
      
      @for (person of people(); track person.id) {
        <app-person-card 
          [person]="person"
          (onClick)="viewTransactions($event)"
        />
      }
    </div>
  </div>
</div>

<!-- Add Person Modal -->
<app-modal 
  [isOpen]="showAddModal()" 
  [title]="'افزودن شخص جدید'"
  (closed)="closeAddModal()"
>
  <app-edit-person-form
    [initialData]="addPersonData()"
    [buttonText]="'ثبت شخص'"
    [buttonIcon]="'user-plus'"
    (onSave)="addPerson($event)"
  />
</app-modal>

<!-- Edit Person Modal -->
<app-modal 
  [isOpen]="showEditModal()" 
  [title]="'ویرایش مشخصات شخص'"
  (closed)="closeEditModal()"
>
  <app-edit-person-form
    [initialData]="editPersonData()"
    (onSave)="saveEditedPerson($event)"
  />
</app-modal>

<!-- Confirm Dialog -->
<app-confirm-dialog
  [isOpen]="showConfirmDialog()"
  [message]="confirmMessage()"
  (confirmed)="onConfirm($event)"
/>
