<div class="min-h-screen bg-gray-50 p-5">
  <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-6">
    <!-- Header -->
    <div class="mb-4">
      <h1 class="text-2xl font-bold text-center text-blue-700">دفتر معین شخصی</h1>
      <div class="flex justify-end items-center mt-2">
        @if (currentUser(); as user) {
          <span class="text-gray-600 text-sm ml-2">خوش آمدید، {{ user }}</span>
        }
        <app-button 
          [variant]="'destructive'" 
          [size]="'sm'"
          (clicked)="logout()"
          title="خروج"
        >
          خروج
        </app-button>
      </div>
    </div>

    <hr class="mb-6 border-gray-200">

    <!-- Search -->
    <div class="mb-5">
      <input
        type="text"
        [value]="searchTerm()"
        (input)="onSearchChange($any($event.target).value)"
        placeholder="جستجو بر اساس نام..."
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
      />
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold text-blue-700">لیست افراد</h2>
      <div class="flex gap-2">
        <app-button 
          [variant]="'default'"
          [size]="'sm'"
          (clicked)="openAddModal()"
        >
          افزودن +
        </app-button>
        <app-button 
          [variant]="'default'"
          [size]="'sm'"
          (clicked)="exportData()"
          class="bg-green-600 hover:bg-green-700"
        >
          خروجی
        </app-button>
      </div>
    </div>

    <!-- People List -->
    <div class="space-y-2">
      @if (people().length === 0) {
        <p class="text-center text-gray-500 py-8">هیچ شخصی یافت نشد.</p>
      }
      
      @for (person of people(); track person.id) {
        <div class="flex items-center justify-between p-4 border-b border-gray-200 hover:bg-gray-50 transition-colors">
          <div 
            class="flex-grow cursor-pointer"
            (click)="viewTransactions(person)"
          >
            <span class="font-bold text-gray-900">{{ person.name }}</span>
          </div>
          
          <div class="flex gap-2">
            <app-button
              [variant]="'outline'"
              [size]="'sm'"
              (clicked)="openEditModal(person)"
              title="ویرایش مشخصات"
            >
              ویرایش
            </app-button>
            <app-button
              [variant]="'destructive'"
              [size]="'sm'"
              (clicked)="confirmDeletePerson(person.id)"
              title="حذف شخص"
            >
              حذف
            </app-button>
          </div>
        </div>
      }
    </div>
  </div>
</div>

<!-- Add Person Modal -->
<app-modal 
  [isOpen]="showAddModal()" 
  [title]="'افزودن شخص جدید'"
  (closed)="closeAddModal()"
>
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">نام:</label>
      <input
        type="text"
        [value]="newPersonName()"
        (input)="newPersonName.set($any($event.target).value)"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
      />
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">شماره تلفن:</label>
      <input
        type="text"
        [value]="newPersonPhone()"
        (input)="newPersonPhone.set($any($event.target).value)"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
      />
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">آدرس:</label>
      <textarea
        [value]="newPersonAddress()"
        (input)="newPersonAddress.set($any($event.target).value)"
        rows="3"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
      ></textarea>
    </div>
    
    <app-button 
      [fullWidth]="true"
      (clicked)="addPerson()"
    >
      ثبت شخص
    </app-button>
  </div>
</app-modal>

<!-- Edit Person Modal -->
<app-modal 
  [isOpen]="showEditModal()" 
  [title]="'ویرایش مشخصات شخص'"
  (closed)="closeEditModal()"
>
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">نام:</label>
      <input
        type="text"
        [value]="editPersonName()"
        (input)="editPersonName.set($any($event.target).value)"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
      />
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">شماره تلفن:</label>
      <input
        type="text"
        [value]="editPersonPhone()"
        (input)="editPersonPhone.set($any($event.target).value)"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
      />
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">آدرس:</label>
      <textarea
        [value]="editPersonAddress()"
        (input)="editPersonAddress.set($any($event.target).value)"
        rows="3"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
      ></textarea>
    </div>
    
    <app-button 
      [fullWidth]="true"
      (clicked)="saveEditedPerson()"
    >
      ذخیره تغییرات
    </app-button>
  </div>
</app-modal>

<!-- Confirm Dialog -->
<app-confirm-dialog
  [isOpen]="showConfirmDialog()"
  [message]="confirmMessage()"
  (confirmed)="onConfirm($event)"
/>
