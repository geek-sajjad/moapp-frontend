<div class="bg-gradient-to-r from-blue-100 to-gray-100 px-5 py-4 border-b border-gray-300">
  <div class="flex flex-col gap-3">
    <div>
      <h1 class="text-2xl font-extrabold text-gray-900 flex items-center gap-2.5">
        <div class="p-2 bg-blue-100 rounded-xl">
          <app-icon name="book" [size]="24" class="text-blue-600" />
        </div>
        دفتر معین شخصی
      </h1>
      @if (currentUser(); as user) {
        <p class="text-gray-600 text-sm font-medium mt-2 mr-11">خوش آمدید، <strong class="text-gray-900 font-extrabold">{{ user.fullName }}</strong></p>
      }
    </div>
    <app-button 
      [variant]="'destructive'" 
      [size]="'sm'"
      (clicked)="handleLogout()"
      title="خروج"
      class="self-start"
    >
      <app-icon name="log-out" [size]="16" />
      خروج
    </app-button>
  </div>
</div>
