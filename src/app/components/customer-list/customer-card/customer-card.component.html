<div class="bg-white rounded-xl shadow-md border border-gray-300 hover:shadow-xl hover:border-blue-400 transition-all duration-300 overflow-hidden group animate-slide-up duration-300">
  <div class="flex flex-col p-5 gap-3">
    <div 
      class="flex items-center gap-3.5 cursor-pointer"
      (click)="handleClick()"
    >
      <div class="flex-shrink-0 w-12 h-12 rounded-xl bg-blue-100 flex items-center justify-center group-hover:bg-blue-200 transition-colors">
        <app-icon name="user" [size]="22" class="text-blue-600" />
      </div>
      <div class="flex-grow min-w-0">
        <h3 class="font-extrabold text-gray-900 text-base group-hover:text-blue-600 transition-colors truncate">{{ customer().name }}</h3>
        @if (customer().phoneNumber) {
          <p class="text-gray-600 text-sm font-medium mt-1 truncate" dir="ltr">{{ customer().phoneNumber }}</p>
        }
        @if (customer().description) {
          <p class="text-gray-500 text-xs mt-1 truncate">{{ customer().description }}</p>
        }
      </div>
    </div>
  </div>
</div>
