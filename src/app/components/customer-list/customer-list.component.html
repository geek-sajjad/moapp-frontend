<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-gray-50 p-3">
  <div class="w-full">
    <!-- Header Card -->
    <div class="bg-white rounded-xl shadow-xl border border-gray-300 mb-4 overflow-hidden animate-fade-in-down duration-300">
      <app-header 
        [currentUser]="currentUser()"
        (onLogout)="logout()"
      />

      <!-- Search Bar -->
      <div class="p-4 bg-gray-50">
        <app-search-bar 
          [value]="searchTerm()"
          [placeholder]="'جستجو بر اساس نام...'"
          (onChange)="onSearchChange($event)"
        />
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col gap-3 mb-4">
      <h2 class="text-xl font-extrabold text-gray-900 flex items-center gap-2.5">
        <app-icon name="users" [size]="22" class="text-blue-600" />
        لیست مشتریان
        @if (customers().length > 0) {
          <span class="text-sm font-semibold text-gray-500">({{ customers().length }} مشتری)</span>
        }
      </h2>
      <div class="flex gap-3">
        <app-button 
          [variant]="'default'"
          [size]="'default'"
          (clicked)="openAddModal()"
          class="flex-1"
        >
          <app-icon name="plus" [size]="18" />
          افزودن
        </app-button>
      </div>
      <div class="bg-white rounded-lg shadow-md border border-gray-300 p-3">
        <app-toggle
          [checked]="includeArchived()"
          [label]="'نمایش مشتریان آرشیو شده'"
          (onChange)="onToggleArchived($event)"
        />
      </div>
    </div>

    <!-- Customers List -->
    <div class="space-y-2.5">
      @if (isLoading()) {
        <div class="bg-white rounded-xl shadow-lg border border-gray-300 p-10 text-center animate-fade-in-scale duration-300">
          <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-blue-100 mb-4">
            <app-icon name="loading" [size]="36" class="text-blue-600 animate-spin" />
          </div>
          <p class="text-gray-700 text-lg font-bold">در حال بارگذاری...</p>
        </div>
      } @else if (customers().length === 0) {
        <div class="bg-white rounded-xl shadow-lg border border-gray-300 p-10 text-center animate-fade-in-scale duration-300">
          <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gray-100 mb-4">
            <app-icon name="users" [size]="36" class="text-gray-400" />
          </div>
          <p class="text-gray-700 text-lg font-bold">هیچ مشتری یافت نشد</p>
          <p class="text-gray-500 text-sm font-medium mt-2">برای شروع، یک مشتری جدید اضافه کنید</p>
        </div>
      } @else {
        @for (customer of customers(); track customer.id) {
          <app-customer-card 
            [customer]="customer"
            (onClick)="viewTransactions($event)"
            (onEdit)="openEditModal($event)"
          />
        }
      }
    </div>
  </div>
</div>

<!-- Add Customer Modal -->
<app-modal 
  [isOpen]="showAddModal()" 
  [title]="'افزودن مشتری جدید'"
  (closed)="closeAddModal()"
>
  <app-customer-form
    [initialData]="addCustomerData()"
    [buttonText]="'ثبت مشتری'"
    [buttonIcon]="'user-plus'"
    (onSave)="addCustomer($event)"
  />
</app-modal>

<!-- Edit Customer Modal -->
<app-modal 
  [isOpen]="showEditModal()" 
  [title]="'ویرایش مشخصات مشتری'"
  (closed)="closeEditModal()"
>
  <app-customer-form
    [initialData]="editCustomerData()"
    (onSave)="saveEditedCustomer($event)"
    (onArchive)="archiveCustomer($event)"
    (onUnarchive)="unarchiveCustomer($event)"
  />
</app-modal>

<!-- Confirm Dialog -->
<app-confirm-dialog
  [isOpen]="showConfirmDialog()"
  [message]="confirmMessage()"
  (confirmed)="onConfirm($event)"
/>
