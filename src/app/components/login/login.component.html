<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-white to-gray-50 px-3 py-6"
>
  <div class="w-full animate-fade-in-scale duration-500">
    <!-- Logo/Header -->
    <div class="text-center mb-6">
      <div
        class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-100 mb-4 shadow-lg"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="text-blue-600"
        >
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold text-gray-900 mb-2">دفتر معین شخصی</h1>
      <p class="text-gray-600 text-sm font-medium">مدیریت حساب‌های شخصی و تراکنش‌ها</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-2xl border border-gray-300 overflow-hidden">
      <!-- Card Header -->
      <div
        class="px-5 py-4 border-b border-gray-300 bg-gradient-to-r from-blue-50 to-gray-50"
      >
        <h2 class="text-xl font-extrabold text-center text-gray-900">ورود به سیستم</h2>
      </div>

      <!-- Card Content -->
      <form (ngSubmit)="onLogin()" class="p-5 space-y-5">
        <div class="space-y-2.5">
          <label for="username" class="block text-sm font-bold text-gray-900">
            نام کاربری
          </label>
          <div class="relative">
            <div class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <input
              type="text"
              id="username"
              [(ngModel)]="username"
              name="username"
              placeholder="نام کاربری خود را وارد کنید"
              class="w-full min-h-[48px] pr-12 pl-4 py-3 border-2 border-gray-300 bg-white rounded-xl text-base font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 focus:border-blue-500 hover:border-blue-400 placeholder:text-gray-400 placeholder:font-normal touch-manipulation"
            />
          </div>
        </div>

        <div class="space-y-2.5">
          <label for="password" class="block text-sm font-bold text-gray-900">
            رمز عبور
          </label>
          <div class="relative">
            <div class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            <input
              type="password"
              id="password"
              [(ngModel)]="password"
              name="password"
              placeholder="رمز عبور خود را وارد کنید"
              class="w-full min-h-[48px] pr-12 pl-4 py-3 border-2 border-gray-300 bg-white rounded-xl text-base font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 focus:border-blue-500 hover:border-blue-400 placeholder:text-gray-400 placeholder:font-normal touch-manipulation"
            />
          </div>
        </div>

        @if (errorMessage()) {
          <div
            class="bg-red-50 border-2 border-red-200 text-red-700 rounded-xl p-4 animate-fade-in-down"
          >
            <div class="flex items-center gap-2.5">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
              </svg>
              <span class="text-sm font-bold">{{ errorMessage() }}</span>
            </div>
          </div>
        }

        <app-button type="submit" [fullWidth]="true" [size]="'lg'" class="mt-2">
          ورود به حساب کاربری
        </app-button>
      </form>

      <!-- Card Footer -->
      <div class="px-5 py-4 bg-gray-50 border-t border-gray-300">
        <div class="flex items-center justify-center gap-2.5 text-sm text-gray-600">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span class="font-medium"
            >نام کاربری و رمز عبور: <strong class="text-gray-900 font-bold">admin / admin</strong></span
          >
        </div>
      </div>
    </div>
  </div>
</div>
