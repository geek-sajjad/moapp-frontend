<div class="w-full space-y-2">
  @if (label()) {
    <label
      [for]="id()"
      class="text-sm font-medium leading-none text-gray-900 peer-disabled:cursor-not-allowed peer-disabled:opacity-70"
    >
      {{ label() }}
    </label>
  }
  <input
    [id]="id()"
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="value()"
    (input)="onInput($event)"
    [class]="getInputClasses()"
  />
  @if (error()) {
    <p
      class="text-sm font-medium text-red-600 animate-fade-in-down"
    >
      {{ error() }}
    </p>
  }
</div>
