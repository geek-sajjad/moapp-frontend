@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-end sm:items-center justify-center animate-fade-in duration-200"
  >
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm"></div>

    <!-- Dialog Content -->
    <div
      class="relative bg-white rounded-t-2xl sm:rounded-xl shadow-2xl w-full max-w-full sm:max-w-md mx-0 sm:mx-4 z-10 animate-slide-up duration-300 border-t border-x sm:border border-gray-300"
    >
      <!-- Icon -->
      <div class="flex justify-center pt-6">
        <div class="rounded-2xl bg-red-50 p-4">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="text-red-600"
          >
            <path
              d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"
            ></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
      </div>

      <!-- Message -->
      <div class="px-5 py-4">
        <p class="text-center text-gray-900 font-bold text-base leading-relaxed">{{ message() }}</p>
      </div>

      <!-- Actions -->
      <div class="flex gap-3 px-5 pb-5">
        <app-button [variant]="'outline'" [size]="'lg'" (clicked)="onNo()" class="flex-1"> خیر </app-button>
        <app-button [variant]="'destructive'" [size]="'lg'" (clicked)="onYes()" class="flex-1">
          بله، حذف شود
        </app-button>
      </div>
    </div>
  </div>
}
