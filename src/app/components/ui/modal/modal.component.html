@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-end sm:items-center justify-center animate-fade-in duration-200"
  >
    <!-- Backdrop -->
    <div
      class="fixed inset-0 bg-black/60 backdrop-blur-sm transition-opacity"
      (click)="onClose()"
    ></div>

    <!-- Modal Content - Slides up from bottom on mobile -->
    <div
      class="relative bg-white rounded-t-2xl sm:rounded-xl shadow-2xl w-full max-w-full sm:max-w-lg mx-0 sm:mx-4 z-10 animate-slide-up duration-300 border-t border-x sm:border border-gray-300 max-h-[90vh] overflow-y-auto"
    >
      <!-- Close Button -->
      @if (showClose()) {
        <button
          (click)="onClose()"
          class="absolute left-3 top-3 rounded-lg p-1.5 text-gray-500 hover:text-gray-900 hover:bg-gray-100 transition-colors"
          aria-label="Close"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      }

      <!-- Title -->
      @if (title()) {
        <div class="border-b border-gray-300 px-4 py-3">
          <h2 class="text-base font-bold text-gray-900 pr-8">
            {{ title() }}
          </h2>
        </div>
      }

      <!-- Content -->
      <div class="p-4">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
